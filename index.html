<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация на ГТО</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <div class="badge">ГТО</div>
      <h1>Регистрация на сдачу нормативов</h1>
      <p class="muted">«Готов к труду и обороне»</p>
    </header>

    <form id="form" novalidate>
      <fieldset>
        <legend>Дата сдачи</legend>
        <div id="dates" class="dates"><p class="muted">Загрузка…</p></div>
      </fieldset>

      <div id="fields" class="fields"></div>

      <p id="message" class="message" role="status" hidden></p>

      <button type="submit" id="submit" hidden>Зарегистрироваться</button>
    </form>
  </main>

  <dialog id="rules" class="rules" aria-labelledby="rules-title">
    <h2 id="rules-title">Правила участия</h2>
    <div id="rules-text" class="rules-text"></div>
    <div class="rules-actions">
      <button type="button" id="rules-accept">С правилами ознакомился</button>
      <button type="button" id="rules-cancel" class="secondary">Назад</button>
    </div>
  </dialog>

  <dialog id="confirm" class="rules" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Участник уже записан</h2>
    <div id="confirm-text" class="rules-text"></div>
    <div class="rules-actions">
      <button type="button" id="confirm-yes">Да, отредактировать</button>
      <button type="button" id="confirm-no" class="secondary">Нет</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
